name: Verify TraceVault
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npx playwright test --grep-invert "installed Chrome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracevault-browser-evidence
          path: output/playwright/
          retention-days: 7
